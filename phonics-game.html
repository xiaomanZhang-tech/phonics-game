<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>自然拼读小达人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { height: -webkit-fill-available; }
        body {
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        button { touch-action: manipulation; }

        /* Floating background decorations */
        .bg-deco {
            position: fixed;
            border-radius: 50%;
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }
        .bg-deco:nth-child(1) { width: 300px; height: 300px; background: #fff; top: -50px; left: -50px; }
        .bg-deco:nth-child(2) { width: 200px; height: 200px; background: #ffd700; bottom: 10%; right: 5%; }
        .bg-deco:nth-child(3) { width: 150px; height: 150px; background: #ff6b6b; top: 50%; left: 80%; }
        .bg-deco:nth-child(4) { width: 250px; height: 250px; background: #48dbfb; bottom: -50px; left: 20%; }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 20px;
            margin: 10px;
        }

        /* Screen transitions */
        .screen {
            display: none;
            background: rgba(255,255,255,0.95);
            border-radius: 40px;
            padding: 35px 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease;
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(400px) rotate(720deg); opacity: 0; }
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== HOME SCREEN ===== */
        .home-title {
            text-align: center;
            margin-bottom: 10px;
        }
        .home-title .main-icon {
            font-size: 72px;
            display: block;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }
        .home-title h1 {
            font-size: 32px;
            color: #4a3f6b;
            letter-spacing: 2px;
        }
        .home-title p {
            color: #999;
            font-size: 15px;
            margin-top: 6px;
        }

        .level-select {
            margin: 25px 0;
        }
        .level-select .label {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .level-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .level-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 2px solid #ddd;
            background: #fff;
            font-size: 16px;
            font-weight: bold;
            color: #999;
            cursor: pointer;
            transition: all 0.3s;
        }
        .level-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: #fff;
        }
        .level-btn:hover { transform: scale(1.1); }

        .mode-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 20px 0 5px;
        }

        .mode-btn {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 20px 24px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            width: 100%;
        }
        .mode-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .mode-btn:active { transform: scale(0.97); }
        .mode-btn .mode-icon { font-size: 40px; flex-shrink: 0; }
        .mode-btn .mode-info h3 { font-size: 19px; color: #fff; margin-bottom: 4px; }
        .mode-btn .mode-info p { font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.4; }

        .mode-btn.mode-letter { background: linear-gradient(135deg, #667eea, #764ba2); }
        .mode-btn.mode-blend { background: linear-gradient(135deg, #f093fb, #f5576c); }

        /* ===== GAME SCREEN ===== */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .game-header .back-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 5px;
            color: #999;
            transition: transform 0.2s;
        }
        .game-header .back-btn:hover { transform: scale(1.2); }
        .game-mode-label {
            font-size: 13px;
            color: #999;
            background: #f5f5f5;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .score-display {
            text-align: center;
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
        }
        .score-display span { color: #f5576c; font-weight: bold; font-size: 20px; }

        /* Question area */
        .question-area {
            text-align: center;
            margin-bottom: 25px;
            min-height: 100px;
        }

        /* Game 1: Letter detective */
        .sound-prompt {
            font-size: 18px;
            color: #666;
            margin-bottom: 8px;
        }
        .sound-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px; height: 90px;
            border-radius: 50%;
            border: 4px solid #667eea;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(102,126,234,0.4);
            margin: 10px 0;
        }
        .sound-btn:hover { transform: scale(1.1); }
        .sound-btn:active { transform: scale(0.95); }
        .sound-btn.playing { animation: bounce 0.5s ease; }

        .sound-hint {
            font-size: 22px;
            color: #4a3f6b;
            font-weight: bold;
            margin-top: 10px;
            min-height: 35px;
        }

        /* Game 2: Blending */
        .blend-word {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .blend-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px; height: 70px;
            border-radius: 12px;
            font-size: 36px;
            font-weight: bold;
            color: #4a3f6b;
            background: #f0eeff;
            border: 3px solid #ddd;
            transition: all 0.3s;
        }
        .blend-letter.highlight {
            border-color: #667eea;
            background: #667eea;
            color: #fff;
            animation: popIn 0.3s ease;
        }

        .blend-hint {
            font-size: 15px;
            color: #999;
            margin-top: 8px;
        }

        /* Choices grid */
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 15px 0;
        }

        .choice-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            border-radius: 20px;
            border: 3px solid #eee;
            background: #fff;
            cursor: pointer;
            transition: all 0.25s;
            min-height: 100px;
        }
        .choice-btn:hover {
            border-color: #667eea;
            background: #f8f7ff;
            transform: translateY(-2px);
        }
        .choice-btn:active { transform: scale(0.95); }
        .choice-btn .choice-emoji { font-size: 48px; margin-bottom: 4px; }
        .choice-btn .choice-text {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        .choice-btn .choice-letter {
            font-size: 48px;
            font-weight: bold;
            color: #4a3f6b;
        }

        .choice-btn.correct {
            border-color: #2ecc71;
            background: #e8f8f0;
            animation: popIn 0.3s ease;
        }
        .choice-btn.wrong {
            border-color: #e74c3c;
            background: #fde8e8;
            animation: shake 0.4s ease;
        }
        .choice-btn.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        /* ===== RESULT SCREEN ===== */
        .result-content {
            text-align: center;
        }
        .result-content .result-icon { font-size: 80px; margin-bottom: 5px; }
        .result-content h2 { font-size: 28px; color: #4a3f6b; margin-bottom: 5px; }
        .result-content .result-sub { color: #999; font-size: 15px; margin-bottom: 20px; }

        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .stars .star {
            font-size: 50px;
            opacity: 0.2;
            transition: all 0.5s;
        }
        .stars .star.active {
            opacity: 1;
            animation: popIn 0.5s ease;
        }
        .stars .star:nth-child(1).active { animation-delay: 0s; }
        .stars .star:nth-child(2).active { animation-delay: 0.2s; }
        .stars .star:nth-child(3).active { animation-delay: 0.4s; }

        .result-stats {
            background: #f8f7ff;
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
        }
        .result-stats .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 16px;
            color: #666;
            border-bottom: 1px solid #eee;
        }
        .result-stats .stat-row:last-child { border-bottom: none; }
        .result-stats .stat-row .stat-val { font-weight: bold; color: #4a3f6b; }
        .result-stats .stat-row .stat-val.green { color: #2ecc71; }
        .result-stats .stat-row .stat-val.red { color: #e74c3c; }

        .result-btns {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .result-btns button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .result-btns button:hover { transform: translateY(-2px); }
        .result-btns .btn-retry {
            background: #f0eeff;
            color: #667eea;
        }
        .result-btns .btn-home {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -20px;
            animation: confettiFall 3s ease-in-out forwards;
        }

        /* Speaking indicator */
        .speaking-indicator {
            display: inline-block;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #2ecc71;
            margin-left: 8px;
            animation: bounce 0.6s ease infinite;
        }

        /* Feedback overlay */
        .feedback-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .feedback-overlay.show { opacity: 1; }
        .feedback-emoji {
            font-size: 120px;
            animation: popIn 0.5s ease, float 1.5s ease-in-out 0.5s infinite;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container { padding: 8px; margin: 4px; }
            .screen { padding: 22px 16px; border-radius: 24px; }
            .home-title .main-icon { font-size: 52px; }
            .home-title h1 { font-size: 24px; }
            .category-card { padding: 14px 16px; gap: 12px; }
            .category-card .cat-icon { font-size: 30px; }
            .category-card .cat-info h3 { font-size: 16px; }
            .category-card .cat-info p { font-size: 11px; }
            .submode-btn { padding: 14px 16px; }
            .submode-btn .sm-icon { font-size: 28px; }
            .submode-btn .sm-info h4 { font-size: 15px; }
            .choice-btn { min-height: 76px; padding: 12px 6px; }
            .choice-btn .choice-emoji { font-size: 36px; }
            .choice-btn .choice-letter { font-size: 36px; }
            .sound-btn { width: 70px; height: 70px; font-size: 32px; }
            .blend-letter { width: 46px; height: 54px; font-size: 26px; }
            .letter-tile { width: 46px; height: 52px; font-size: 26px; }
            .spelling-slot { width: 46px; height: 52px; font-size: 26px; }
            .syllable-word-display { font-size: 30px; }
            .word-card-display { font-size: 22px; padding: 14px 8px; }
            .result-content .result-icon { font-size: 56px; }
            .stars .star { font-size: 36px; }
            .result-btns { flex-direction: column; }
            .result-btns button { padding: 14px; }
        }
        /* ===== CATEGORY SCREEN (from home) ===== */
        .category-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 10px 0;
        }
        .category-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 22px;
            border: none;
            border-radius: 22px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            width: 100%;
            position: relative;
        }
        .category-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .category-card:active { transform: scale(0.97); }
        .category-card .cat-icon { font-size: 36px; flex-shrink: 0; }
        .category-card .cat-info h3 { font-size: 18px; color: #fff; margin-bottom: 2px; }
        .category-card .cat-info p { font-size: 12px; color: rgba(255,255,255,0.8); }
        .category-card .cat-arrow { position: absolute; right: 18px; font-size: 22px; color: rgba(255,255,255,0.6); }

        .cat-phonemic { background: linear-gradient(135deg, #667eea, #764ba2); }
        .cat-blend    { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .cat-vowel    { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .cat-rule     { background: linear-gradient(135deg, #43e97b, #38f9d7); }

        /* ===== SUB-MODE SCREEN ===== */
        .submode-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .submode-header .back-btn {
            background: none; border: none; font-size: 28px; cursor: pointer; padding: 5px; color: #999;
        }
        .submode-header h2 { font-size: 22px; color: #4a3f6b; flex: 1; }
        .submode-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .submode-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border: 2px solid #eee;
            border-radius: 18px;
            background: #fff;
            cursor: pointer;
            transition: all 0.25s;
            text-align: left;
            width: 100%;
        }
        .submode-btn:hover {
            border-color: #667eea;
            background: #f8f7ff;
            transform: translateX(4px);
        }
        .submode-btn:active { transform: scale(0.97); }
        .submode-btn .sm-icon { font-size: 32px; flex-shrink: 0; }
        .submode-btn .sm-info h4 { font-size: 16px; color: #4a3f6b; margin-bottom: 2px; }
        .submode-btn .sm-info p { font-size: 12px; color: #999; }
        .submode-btn .sm-badge {
            margin-left: auto;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            background: #f0eeff;
            color: #667eea;
            flex-shrink: 0;
        }

        /* ===== SPELLING MODE ===== */
        .spelling-hint {
            font-size: 14px;
            color: #999;
            margin: 8px 0;
        }
        .letter-tiles {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
            min-height: 60px;
        }
        .letter-tile {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px; height: 58px;
            border-radius: 12px;
            font-size: 30px;
            font-weight: bold;
            color: #4a3f6b;
            background: #f0eeff;
            border: 3px solid #ddd;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .letter-tile:hover { border-color: #667eea; background: #e8e5ff; transform: translateY(-3px); }
        .letter-tile:active { transform: scale(0.92); }
        .letter-tile.used { opacity: 0.2; pointer-events: none; }

        .spelling-slots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
            min-height: 60px;
        }
        .spelling-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px; height: 58px;
            border-radius: 12px;
            font-size: 30px;
            font-weight: bold;
            color: #4a3f6b;
            background: #fff;
            border: 3px dashed #ccc;
            transition: all 0.3s;
        }
        .spelling-slot.filled {
            border-style: solid;
            border-color: #667eea;
            background: #f0eeff;
        }
        .spelling-slot.correct {
            border-color: #2ecc71;
            background: #e8f8f0;
        }
        .spelling-slot.wrong {
            border-color: #e74c3c;
            background: #fde8e8;
        }

        .spelling-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 15px 0;
        }
        .spelling-actions button {
            padding: 12px 30px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
        }
        .spelling-actions .btn-check {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        .spelling-actions .btn-check:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .spelling-actions .btn-clear {
            background: #f5f5f5;
            color: #999;
        }
        .spelling-actions button:hover { transform: translateY(-2px); }
        .spelling-actions button:active { transform: scale(0.95); }

        /* Syllable mode */
        .syllable-word-display {
            font-size: 36px;
            font-weight: bold;
            color: #4a3f6b;
            margin: 15px 0;
            letter-spacing: 3px;
        }

        /* Sight word / special cards */
        .word-card-display {
            font-size: 42px;
            font-weight: bold;
            color: #4a3f6b;
            margin: 18px 0;
            padding: 20px;
            background: #f8f7ff;
            border-radius: 20px;
            border: 3px solid #f0eeff;
        }
    </style>
</head>
<body>

    <!-- Background decorations -->
    <div class="bg-deco"></div>
    <div class="bg-deco"></div>
    <div class="bg-deco"></div>
    <div class="bg-deco"></div>

    <!-- Confetti container -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Feedback overlay -->
    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-emoji" id="feedbackEmoji"></div>
    </div>

    <div class="container">

        <!-- ============ HOME SCREEN ============ -->
        <div class="screen active" id="homeScreen">
            <div class="home-title">
                <span class="main-icon">🔤</span>
                <h1>自然拼读小达人</h1>
                <p>Phonics Star</p>
            </div>

            <div class="level-select">
                <div class="label">选择难度 Choose Level</div>
                <div class="level-buttons">
                    <button class="level-btn active" data-level="1" onclick="setLevel(1)">1</button>
                    <button class="level-btn" data-level="2" onclick="setLevel(2)">2</button>
                    <button class="level-btn" data-level="3" onclick="setLevel(3)">3</button>
                </div>
            </div>

            <div class="category-grid">
                <button class="category-card cat-phonemic" onclick="showSubModes('phonemic')">
                    <span class="cat-icon">🎯</span>
                    <div class="cat-info">
                        <h3>听音辨音</h3>
                        <p>Phonemic Awareness — 识别首音、尾音、中间音，区分长短元音与清浊辅音</p>
                    </div>
                    <span class="cat-arrow">›</span>
                </button>
                <button class="category-card cat-blend" onclick="showSubModes('blend')">
                    <span class="cat-icon">🔤</span>
                    <div class="cat-info">
                        <h3>拼读拼写</h3>

        function speak(text, rate = 0.85, callback) {
            if (!window.speechSynthesis) { if (callback) callback(); return; }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voice = getEnglishVoice();
            if (voice) utterance.voice = voice;
            utterance.rate = rate;
            utterance.pitch = 1.1;
            utterance.volume = 1;
            currentUtterance = utterance;
            if (callback) {
                utterance.onend = callback;
            }
            window.speechSynthesis.speak(utterance);
        }

                || letterGroups[1].find(l => l.letter === letter);
            if (data) {
                // Say: "[word]" — emphasis on the starting sound
                speak(data.word, 0.8);
            } else {
                speak(letter, 0.8);
            }
        }

        function speakWord(word) {
            speak(word, 0.75);

        function speakBlendWord(word) {
            // First say each sound slowly, then blend
            const letters = word.split('');
            const sounds = letters.join(' ');
            speak(sounds, 0.5, () => {
                speak(word, 0.7);
            });
        }

        function speakLetterName(letter) {
            // Say the letter NAME (e.g. 'bee', 'cee') — used for alphabet-name mode
            const letterNames = { 'qu': 'cue' };
            const name = letterNames[letter] || letter;
            speak(name, 0.8);
        }

            });
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function generateQuestions() {
            const qs = [];
            const mode = currentSubMode;

            switch (mode) {

                case 'beginning':
                case 'ending':
                case 'middle': {
                    const items = phonemeWords[currentLevel][mode];
                    const shuffled = shuffle(items);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(item => {
                        let distractors = items.filter(l => l.letter !== item.letter).map(l => l.letter);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'phoneme', data: item, choices: shuffle([item.letter, ...distractors]), correct: item.letter });
                    });
                    break;
                }

                case 'shortlong': {
                    const pairs = vowelShortLongPairs[currentLevel];
                    const shuffled = shuffle(pairs);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(pair => {
                        const askLong = Math.random() > 0.5;
                        const correct = askLong ? pair.long : pair.short;
                        let distractors = pairs.filter(p => p !== pair).map(p => askLong ? p.long : p.short);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'shortlong', data: correct, choices: shuffle([correct, ...distractors]), correct: correct.word });
                    });
                    break;

                    const pairs = voicedUnvoicedPairs;
                    const shuffled = shuffle(pairs);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(pair => {
                        const askVoiced = Math.random() > 0.5;
                        const correct = askVoiced ? pair.voiced : pair.unvoiced;
                        let distractors = pairs.filter(p => p !== pair).map(p => askVoiced ? p.voiced : p.unvoiced);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'voiced', data: correct, choices: shuffle([correct, ...distractors]), correct: correct.word });
                    });
                    break;
                }

                case 'cvc':
                case 'blend': {
                    const words = blendWords[currentLevel];
                    const shuffled = shuffle(words);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(item => {
                        let distractors = words.filter(w => w.word !== item.word).map(w => ({ word: w.word, emoji: w.emoji }));
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'blend', data: item, choices: shuffle([item, ...distractors]), correct: item.word });
                    });
                    break;
                }

                case 'syllable': {
                    const words = syllableWords[currentLevel];
                    const shuffled = shuffle(words);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(item => {
                        const counts = [1,2,3,4,5];
                        let distractors = shuffle(counts.filter(c => c !== item.count)).slice(0, 3);
                        qs.push({ type: 'syllable', data: item, choices: shuffle([item.count, ...distractors]), correct: item.count });
                    });
                    break;
                }

                case 'spelling': {
                    const words = spellingWords[currentLevel];
                    const shuffled = shuffle(words);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(item => { qs.push({ type: 'spelling', data: item, correct: item.word }); });
                    break;
                }

                case 'singleconsonant': {
                    const items = letterGroups[currentLevel];
                    const shuffled = shuffle(items);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(item => {
                        let distractors = items.filter(l => l.letter !== item.letter).map(l => l.letter);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'letter', data: item, choices: shuffle([item.letter, ...distractors]), correct: item.letter });
                    });
                    break;
                }

                case 'consonantblend': {
                    const srcLevel = currentLevel === 1 ? 2 : currentLevel;
                    const items = letterGroups[srcLevel];
                    const shuffled = shuffle(items);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(item => {
                        let distractors = items.filter(l => l.letter !== item.letter).map(l => l.letter);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'letter', data: item, choices: shuffle([item.letter, ...distractors]), correct: item.letter });
                    });
                    break;
                }

                case 'shortvowel': {
                    const items = phonemeWords[1].middle;
                    const shuffled = shuffle(items);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(item => {
                        let distractors = items.filter(l => l.letter !== item.letter).map(l => l.letter);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'shortvowel', data: item, choices: shuffle([item.letter, ...distractors]), correct: item.letter });
                    });
                    break;
                }

                case 'longvowel': {
                    const allPairs = magicEWords[currentLevel];
                    const shuffled = shuffle(allPairs);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(pair => {
                        let distractors = allPairs.filter(p => p !== pair).map(p => p.long);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'magice', data: pair.long, choices: shuffle([pair.long, ...distractors]), correct: pair.long.word });
                    });
                    break;
                }

                case 'vowelcombo': {
                    const vowels = ['ai','ea','ee','oa','oo','ar','or','ir','oi','oy','ow','ou'];
                    const items = (letterGroups[2]||[]).concat(letterGroups[3]||[]).filter(l => vowels.includes(l.letter));
                    const shuffled = shuffle(items);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, Math.max(shuffled.length,1)));
                    selected.forEach(item => {
                        let distractors = items.filter(l => l.letter !== item.letter).map(l => l.letter);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'letter', data: item, choices: shuffle([item.letter, ...distractors]), correct: item.letter });
                    });
                    break;
                }

                case 'magice': {
                    const pairs = magicEWords[currentLevel];
                    const shuffled = shuffle(pairs);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(pair => {
                        const askLong = Math.random() > 0.5;
                        const correct = askLong ? pair.long : pair.short;
                        let distractors = pairs.filter(p => p !== pair).map(p => askLong ? p.long : p.short);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'magice', data: correct, choices: shuffle([correct, ...distractors]), correct: correct.word });
                    });
                    break;
                }

                case 'softcg': {
                    const items = softCSGWords[currentLevel];
                    const shuffled = shuffle(items);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(item => {
                        const askHard = Math.random() > 0.5;
                        const correct = askHard ? item.hard : item.soft;
                        let distractors = items.filter(l => l !== item).map(l => askHard ? l.hard : l.soft);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'softcg', data: correct, choices: shuffle([correct, ...distractors]), correct: correct.word });
                    });
                    break;
                }

                case 'specialcombo': {
                    const all = specialCombos[currentLevel] || specialCombos[1];
                    const shuffled = shuffle(all);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(item => {
                        let distractors = all.filter(l => l.word !== item.word).map(l => ({ word: l.word, combo: l.combo, emoji: l.emoji }));
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'specialcombo', data: item, choices: shuffle([item, ...distractors]), correct: item.word });
                    });
                    break;
                }

                case 'sightwords': {
                    const words = sightWords[currentLevel];
                    const shuffled = shuffle(words);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(item => {
                        let distractors = words.filter(w => w.word !== item.word).map(w => w.word);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'sightwords', data: item, choices: shuffle([item.word, ...distractors]), correct: item.word });
                    });
                    break;
                }

                default: {
                    const letters = letterGroups[currentLevel];
                    const shuffled = shuffle(letters);
                    const selected = shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, shuffled.length));
                    selected.forEach(item => {
                        let distractors = letters.filter(l => l.letter !== item.letter).map(l => l.letter);
                        distractors = shuffle(distractors).slice(0, 3);
                        qs.push({ type: 'letter', data: item, choices: shuffle([item.letter, ...distractors]), correct: item.letter });
                    });
                }
            }
            return qs;
        }

        function startGame(subMode) {
            currentSubMode = subMode;
            currentQuestionIndex = 0;
            score = 0;
            correctCount = 0;
            wrongCount = 0;
            isAnswering = false;

            // Label lookup
            const labelMap = {
                beginning: '首音识别', ending: '尾音识别', middle: '中间音识别',
                shortlong: '长短元音', voiced: '清浊辅音',
                cvc: 'CVC拼读', syllable: '多音节拼读', spelling: '听音拼词',
                singleconsonant: '单辅音', consonantblend: '辅音组合',
                shortvowel: '短元音', longvowel: '长元音', vowelcombo: '元音组合',
                magice: '魔法e', softcg: '软音c/g', specialcombo: '特殊组合', sightwords: '高频词'
            };
            const categoryLabelMap = {
                phonemic: '🎯 听音辨音', blend: '🔤 拼读拼写', vowel: '🔊 辅音元音', rule: '⚡ 特殊规则'
            };

            questions = generateQuestions();

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('gameModeLabel').textContent = (labelMap[subMode] || '自然拼读');

            renderQuestion();
        }

        function renderQuestion() {
            if (currentQuestionIndex >= questions.length) { showResult(); return; }

            isAnswering = false;
            const q = questions[currentQuestionIndex];
            const progress = (currentQuestionIndex / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('scoreDisplay').textContent = score;

            const questionArea = document.getElementById('questionArea');
            const choicesGrid = document.getElementById('choicesGrid');
            if (feedbackTimer) { clearTimeout(feedbackTimer); feedbackTimer = null; }

            switch (q.type) {

                case 'letter':
                case 'phoneme':
                case 'shortvowel':
                    questionArea.innerHTML = `
                        <div class="sound-prompt">👇 听一听，选出发音对应的字母</div>
                        <button class="sound-btn" id="playSoundBtn" onclick="playCurrentSound()">🔊</button>
                        <div class="sound-hint" id="soundHint">点击喇叭听发音</div>`;
                    choicesGrid.innerHTML = q.choices.map(c => `
                        <button class="choice-btn" data-value="${c}" onclick="checkAnswer('${c}', this)">
                            <span class="choice-letter">${c}</span>
                        </button>`).join('');
                    setTimeout(() => playCurrentSound(), 500);
                    break;

                case 'blend':
                    questionArea.innerHTML = `
                        <div class="sound-prompt">👇 拼一拼，选出正确的图片</div>
                        <div class="blend-word" id="blendWord">
                            ${q.data.word.split('').map(l => `<span class="blend-letter">${l}</span>`).join('')}
                        </div>
                        <button class="sound-btn" id="playSoundBtn" onclick="playCurrentSound()" style="width:65px;height:65px;font-size:30px;">🔊</button>
                        <div class="blend-hint">点击喇叭听发音 | 想想每个字母发什么音？</div>`;
                    choicesGrid.innerHTML = q.choices.map(c => `
                        <button class="choice-btn" data-value="${c.word}" onclick="checkAnswer('${c.word}', this)">
                            <span class="choice-emoji">${c.emoji}</span>
                            <span class="choice-text">${c.word}</span>
                        </button>`).join('');
                    setTimeout(() => playCurrentSound(), 500);
                    break;

                case 'shortlong':
                case 'magice':
                case 'softcg':
                case 'voiced':
                    questionArea.innerHTML = `
                        <div class="sound-prompt">👇 听一听，选出对应的单词</div>
                        <button class="sound-btn" id="playSoundBtn" onclick="playCurrentSound()">🔊</button>
                        <div class="sound-hint" id="soundHint">点击喇叭听发音</div>`;
                    choicesGrid.innerHTML = q.choices.map(c => `
                        <button class="choice-btn" data-value="${c.word}" onclick="checkAnswer('${c.word}', this)">
                            <span class="choice-emoji">${c.emoji}</span>
                            <span class="choice-text">${c.word}</span>
                        </button>`).join('');
                    setTimeout(() => playCurrentSound(), 500);
                    break;

                case 'syllable':
                    questionArea.innerHTML = `
                        <div class="sound-prompt">👇 听一听，数一数有几个音节</div>
                        <div class="syllable-word-display">${q.data.word}</div>
                        <button class="sound-btn" id="playSoundBtn" onclick="playCurrentSound()" style="width:65px;height:65px;font-size:30px;">🔊</button>
                        <div class="blend-hint">点击喇叭听音节拆分</div>`;
                    choicesGrid.innerHTML = q.choices.map(c => `
                        <button class="choice-btn" data-value="${c}" onclick="checkAnswer(${c}, this)">
                            <span class="choice-letter" style="font-size:40px;">${c}</span>
                            <span class="choice-text">${c === 1 ? '音节' : '个音节'}</span>
                        </button>`).join('');
                    setTimeout(() => playCurrentSound(), 500);
                    break;

                case 'spelling':
                    renderSpellingQuestion();
                    break;

                case 'specialcombo':
                    questionArea.innerHTML = `
                        <div class="sound-prompt">👇 听一听，选出对应的单词</div>
                        <div style="font-size:22px;color:#667eea;font-weight:bold;margin:8px 0;">🔦 组合: ${q.data.combo}</div>
                        <button class="sound-btn" id="playSoundBtn" onclick="playCurrentSound()" style="width:65px;height:65px;font-size:30px;">🔊</button>
                        <div class="sound-hint" id="soundHint">点击喇叭听发音</div>`;
                    choicesGrid.innerHTML = q.choices.map(c => `
                        <button class="choice-btn" data-value="${c.word}" onclick="checkAnswer('${c.word}', this)">
                            <span class="choice-emoji">${c.emoji}</span>
                            <span class="choice-text">${c.word}</span>
                        </button>`).join('');
                    setTimeout(() => playCurrentSound(), 500);
                    break;

                case 'sightwords':
                    questionArea.innerHTML = `
                        <div class="sound-prompt">👇 听一听，选出正确的单词</div>
                        <button class="sound-btn" id="playSoundBtn" onclick="playCurrentSound()" style="width:65px;height:65px;font-size:30px;">🔊</button>
                        <div class="sound-hint" id="soundHint">点击喇叭听发音</div>`;
                    choicesGrid.innerHTML = q.choices.map(c => `
                        <button class="choice-btn" data-value="${c}" onclick="checkAnswer('${c}', this)">
                            <span class="word-card-display" style="font-size:26px;padding:12px 8px;margin:0;">${c}</span>
                        </button>`).join('');
                    setTimeout(() => playCurrentSound(), 500);
                    break;

                default:
                    questionArea.innerHTML = `<div style="text-align:center;color:#999;">Loading...</div>`;
                    choicesGrid.innerHTML = '';
            }
        }

        function renderSpellingQuestion() {
            const q = questions[currentQuestionIndex];
            const word = q.data.word;
            const letters = word.split('');
            const shuffledTiles = shuffle(letters.map((l, i) => ({ letter: l, idx: i })));

            spellingSelected = [];

            const questionArea = document.getElementById('questionArea');
            const choicesGrid = document.getElementById('choicesGrid');

            questionArea.innerHTML = `
                <div class="sound-prompt">👇 听发音，拼出单词</div>
                <button class="sound-btn" id="playSoundBtn" onclick="playCurrentSound()" style="width:65px;height:65px;font-size:30px;">🔊</button>
                <div class="spelling-hint">点击字母拼出你听到的单词</div>`;

            choicesGrid.innerHTML = `
                <div class="spelling-slots" id="spellingSlots">
                    ${letters.map(() => `<span class="spelling-slot"></span>`).join('')}
                </div>
                <div class="letter-tiles" id="letterTiles">
                    ${shuffledTiles.map((item, idx) =>
                        `<span class="letter-tile" data-tileidx="${idx}" data-letter="${item.letter}" onclick="spellingTapTile(${idx}, this)">${item.letter}</span>`
                    ).join('')}
                </div>
                <div class="spelling-actions">
                    <button class="btn-clear" onclick="spellingClear()">🗑️ 清除</button>
                    <button class="btn-check" id="spellingCheckBtn" onclick="spellingSubmit()" disabled>✅ 确认</button>
                </div>`;

            setTimeout(() => playCurrentSound(), 500);
        }

        function spellingTapTile(tileIdx, el) {
            const slots = document.querySelectorAll('.spelling-slot');
            const nextEmpty = Array.from(slots).find(s => !s.classList.contains('filled'));
            if (!nextEmpty) return;
            nextEmpty.textContent = el.dataset.letter;
            nextEmpty.classList.add('filled');
            el.classList.add('used');
            spellingSelected.push({ tileIdx, letter: el.dataset.letter });
            document.getElementById('spellingCheckBtn').disabled = document.querySelectorAll('.spelling-slot.filled').length !== slots.length;
        }

        function spellingClear() {
            document.querySelectorAll('.spelling-slot').forEach(s => { s.textContent = ''; s.classList.remove('filled','correct','wrong'); });
            document.querySelectorAll('.letter-tile').forEach(t => t.classList.remove('used'));
            spellingSelected = [];
            document.getElementById('spellingCheckBtn').disabled = true;
        }

        function spellingSubmit() {
            if (isAnswering) return;
            const q = questions[currentQuestionIndex];
            const userWord = spellingSelected.map(s => s.letter).join('');
            const isCorrect = userWord === q.correct;
            isAnswering = true;

            document.getElementById('spellingCheckBtn').disabled = true;
            document.querySelectorAll('.letter-tile').forEach(t => t.style.pointerEvents = 'none');
            const slots = document.querySelectorAll('.spelling-slot');
            q.correct.split('').forEach((cl, i) => slots[i].classList.add(slots[i].textContent === cl ? 'correct' : 'wrong'));

            if (isCorrect) { score += 10; correctCount++; document.getElementById('scoreDisplay').textContent = score; showFeedback(true); }
            else { wrongCount++; showFeedback(false); }

            feedbackTimer = setTimeout(() => { currentQuestionIndex++; renderQuestion(); feedbackTimer = null; }, isCorrect ? 1200 : 2500);
        }

        function playCurrentSound() {
            const q = questions[currentQuestionIndex];
            if (!q) return;
            const btn = document.getElementById('playSoundBtn');
            if (btn) btn.classList.add('playing');

            const hint = document.getElementById('soundHint');
            if (hint) hint.textContent = '🔊 仔细听...';

            switch (q.type) {
                case 'letter':
                case 'phoneme':
                case 'shortvowel':
                case 'singleconsonant':
                case 'consonantblend':
                case 'vowelcombo':
                    speakLetterSound(q.data.letter);
                    setTimeout(() => { if (hint) hint.textContent = '🤔 选出发音对应的字母吧！'; }, 1500);
                    break;

                case 'blend':
                    document.querySelectorAll('.blend-letter').forEach((el, i) => setTimeout(() => el.classList.add('highlight'), i * 400));
                    speakBlendWord(q.data.word);
                    break;

                case 'shortlong':
                case 'magice':
                case 'softcg':
                case 'voiced':
                    speak(q.data.word, 0.8);
                    setTimeout(() => { if (hint) hint.textContent = '🤔 选出对应的单词吧！'; }, 1500);
                    break;

                case 'syllable':
                    speakSyllables(q.data.word, q.data.syllables);
                    break;

                case 'spelling':
                    speakWordSlow(q.data.word);
                    setTimeout(() => { if (hint) hint.textContent = '✏️ 用字母拼出这个单词'; }, 2000);
                    break;

                case 'specialcombo':
                    speak(q.data.word, 0.7);
                    setTimeout(() => { if (hint) hint.textContent = '🤔 注意 ' + q.data.combo + ' 的发音'; }, 1500);
                    break;

                case 'sightwords':
                    speak(q.data.word, 0.75);
                    setTimeout(() => { if (hint) hint.textContent = '👁️ 找到你听到的单词'; }, 1500);
                    break;
            }

            setTimeout(() => { if (btn) btn.classList.remove('playing'); }, 1000);
        }

        function checkAnswer(value, btnElement) {
            if (isAnswering) return;
            isAnswering = true;
            const q = questions[currentQuestionIndex];
            const isCorrect = String(value) === String(q.correct);
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.add('disabled'));

            if (isCorrect) {
                btnElement.classList.add('correct');
                score += 10; correctCount++; document.getElementById('scoreDisplay').textContent = score;
                showFeedback(true);
            } else {
                btnElement.classList.add('wrong');
                wrongCount++; showFeedback(false);
                document.querySelectorAll('.choice-btn').forEach(b => {
                    if (String(b.dataset.value) === String(q.correct)) b.classList.add('correct');
                });
            }

            feedbackTimer = setTimeout(() => { currentQuestionIndex++; renderQuestion(); feedbackTimer = null; }, isCorrect ? 1200 : 2200);
        }

        function showFeedback(isCorrect) {
            const overlay = document.getElementById('feedbackOverlay');
            const emoji = document.getElementById('feedbackEmoji');
            if (isCorrect) {
                emoji.textContent = ['🎉', '🌟', '👏', '✨', '💪', '🥳'][Math.floor(Math.random() * 6)];
                overlay.querySelector('.feedback-emoji').textContent = emoji.textContent;
            } else {
                emoji.textContent = ['🤔', '💪', '😊', '⭐'][Math.floor(Math.random() * 4)];
                overlay.querySelector('.feedback-emoji').textContent = emoji.textContent;
            }
            overlay.classList.add('show');
            setTimeout(() => { overlay.classList.remove('show'); }, isCorrect ? 800 : 1200);
        }

        // =============================================
        // RESULT
        // =============================================

        function showResult() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');

            // Show current game mode label
            const modeLabel = document.getElementById('resultModeLabel');
            const catName = categoryLabelMap[currentCategory] || '';
            const subName = labelMap[currentSubMode] || '';
            modeLabel.textContent = catName ? (catName + ' · ' + subName) : subName;

            const total = questions.length;
            const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;

            document.getElementById('totalStat').textContent = total;
            document.getElementById('correctStat').textContent = correctCount;
            document.getElementById('wrongStat').textContent = wrongCount;
            document.getElementById('accuracyStat').textContent = accuracy + '%';

            // Determine star rating
            let stars = 0;
            if (accuracy >= 90) stars = 3;
            else if (accuracy >= 70) stars = 2;
            else if (accuracy >= 40) stars = 1;

            const starEls = document.querySelectorAll('.stars .star');
            starEls.forEach((el, i) => {
                el.classList.toggle('active', i < stars);
            });

            // Title and message based on performance
            const resultIcon = document.getElementById('resultIcon');
            const resultTitle = document.getElementById('resultTitle');
            const resultSub = document.getElementById('resultSub');

            if (stars === 3) {
                resultIcon.textContent = '🏆';
                resultTitle.textContent = '太棒了！Excellent!';
                resultSub.textContent = '你是自然拼读小达人！🎉';
                launchConfetti();
            } else if (stars === 2) {
                resultIcon.textContent = '🌟';
                resultTitle.textContent = '很不错！Great Job!';
                resultSub.textContent = '继续练习，你一定能得三颗星！💪';
            } else if (stars === 1) {
                resultIcon.textContent = '💪';
                resultTitle.textContent = '加油！Keep Trying!';
                resultSub.textContent = '多多练习，你会越来越棒的！😊';
            } else {
                resultIcon.textContent = '📖';
                resultTitle.textContent = '继续努力！Keep Learning!';
                resultSub.textContent = '让我们再来一次吧！';
            }

            // Progress bar at 100%
            document.getElementById('progressFill').style.width = '100%';
        }

        function retryGame() {
            document.getElementById('resultScreen').classList.remove('active');
            startGame(currentSubMode);
        }

        function goHome() {
            if (currentUtterance) {
                speechSynth.cancel();
            }
            if (feedbackTimer) {
                clearTimeout(feedbackTimer);
                feedbackTimer = null;
            }
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('homeScreen').classList.add('active');
        }

        // CONFETTI
        // =============================================

        function launchConfetti() {
            const container = document.getElementById('confettiContainer');
            container.innerHTML = '';
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6b9d', '#c44dff', '#ff9f43'];
            const emojis = ['🌟', '⭐', '✨', '🎉', '🎊', '💫', '🌈'];

            for (let i = 0; i < 40; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                const isEmoji = Math.random() > 0.5;
                piece.textContent = isEmoji ? emojis[Math.floor(Math.random() * emojis.length)] : '';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.background = isEmoji ? 'transparent' : colors[Math.floor(Math.random() * colors.length)];
                piece.style.width = isEmoji ? '20px' : (6 + Math.random() * 8) + 'px';
                piece.style.height = isEmoji ? '20px' : (6 + Math.random() * 8) + 'px';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.animationDuration = (2 + Math.random() * 2) + 's';
                piece.style.animationDelay = Math.random() * 1.5 + 's';
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                container.appendChild(piece);
            }

            setTimeout(() => { container.innerHTML = ''; }, 5000);
        }

        // =============================================
        // INIT
        // =============================================

        // Load voices when available
        if (window.speechSynthesis) {
            speechSynth.getVoices(); // Prime the pump
            speechSynth.onvoiceschanged = () => { speechSynth.getVoices(); };
        }

        console.log('🎯 自然拼读小达人已加载！欢迎使用！');
    </script>

</body>
</html>
